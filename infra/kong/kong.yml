_format_version: '3.0'

# ─────────────────────────────────────────────────────────────
# Upstream services
# ─────────────────────────────────────────────────────────────
services:
  - name: auth
    url: http://auth:4001
    protocol: http
    routes:
      - name: auth-health
        paths:
          - /health
        strip_path: false
        methods:
          - GET
      - name: auth-api
        paths:
          - /api/v1/auth
        strip_path: false
        methods:
          - GET
          - POST

  - name: catalog
    url: http://catalog:4002
    protocol: http
    routes:
      - name: catalog-products
        paths:
          - /api/v1/products
        strip_path: false
        methods:
          - GET
          - POST
          - PATCH
          - DELETE
      - name: catalog-categories
        paths:
          - /api/v1/categories
        strip_path: false
        methods:
          - GET
          - POST
          - PATCH
          - DELETE

# ─────────────────────────────────────────────────────────────
# Plugins (global)
# ─────────────────────────────────────────────────────────────
plugins:
  # Every request gets a unique correlation ID
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid#counter
      echo_downstream: true

  # Global rate limit: 600 requests/minute per IP
  - name: rate-limiting
    config:
      minute: 600
      policy: local
      fault_tolerant: true
      hide_client_headers: false

    # OpenTelemetry tracing — forwards trace context to services
  - name: opentelemetry
    config:
      traces_endpoint: http://otel-collector:4318/v1/traces
      resource_attributes:
        service.name: nexus-gateway
      propagation:
        default_format: w3c
        extract:
          - w3c
        inject:
          - w3c
      sampling_rate: 1.0
