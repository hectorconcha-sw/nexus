name: nexus

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexus

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:-nexus_dev_password}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $${REDIS_PASSWORD:-nexus_dev_password} ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - nexus

  adminer:
    image: adminer:4-standalone
    container_name: nexus-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus

  redisinsight:
    image: redis/redisinsight:latest
    container_name: nexus-redisinsight
    restart: unless-stopped
    ports:
      - '${REDISINSIGHT_PORT:-8001}:5540'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus

volumes:
  postgres-data:
    name: nexus-postgres-data
  redis-data:
    name: nexus-redis-data

networks:
  nexus:
    name: nexus
    driver: bridge
