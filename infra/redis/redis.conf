# ─────────────────────────────────────────────────────────────
# Redis configuration for local development
# ─────────────────────────────────────────────────────────────

# Persistence: append-only file, fsync every second
appendonly yes
appendfsync everysec

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Networking
bind 0.0.0.0
protected-mode no

# Logging
loglevel notice

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128