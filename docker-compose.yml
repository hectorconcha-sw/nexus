name: nexus

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nexus

  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:-nexus_dev_password}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a $${REDIS_PASSWORD:-nexus_dev_password} ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - nexus

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: nexus-auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://auth_service:auth_dev_password@postgres:5432/nexus_auth
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-in-production-min-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      PORT: 4001
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: nexus-auth
    ports:
      - '${AUTH_PORT:-4001}:4001'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    container_name: nexus-catalog
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://catalog_service:catalog_dev_password@postgres:5432/nexus_catalog
      PORT: 4002
      NODE_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: nexus-catalog
    ports:
      - '${CATALOG_PORT:-4002}:4002'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus

  kong:
    image: kong:3.8
    container_name: nexus-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      KONG_LOG_LEVEL: info
      KONG_PLUGINS: bundled
      KONG_TRACING_INSTRUMENTATIONS: all
      KONG_TRACING_SAMPLING_RATE: '1.0'
    volumes:
      - ./infra/kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - '${KONG_PROXY_PORT:-8000}:8000'
      - '${KONG_ADMIN_PORT:-8100}:8001'
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
    networks:
      - nexus
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  adminer:
    image: adminer:4-standalone
    container_name: nexus-adminer
    restart: unless-stopped
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus

  redisinsight:
    image: redis/redisinsight:latest
    container_name: nexus-redisinsight
    restart: unless-stopped
    ports:
      - '${REDISINSIGHT_PORT:-8001}:5540'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - nexus

volumes:
  postgres-data:
    name: nexus-postgres-data
  redis-data:
    name: nexus-redis-data

networks:
  nexus:
    name: nexus
    driver: bridge
