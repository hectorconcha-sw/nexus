# docker-compose.observability.yml
#
# Observability stack: OTel Collector, Prometheus, Loki, Tempo, Grafana.
# Usage: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────
  # OpenTelemetry Collector — receives OTLP, routes to backends
  # ─────────────────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: nexus-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
      - '8889:8889' # Prometheus exporter metrics
    depends_on:
      - tempo
      - loki
    networks:
      - nexus

  # ─────────────────────────────────────────────────────────────
  # Prometheus — metrics backend
  # ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: nexus-prometheus
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    networks:
      - nexus

  # ─────────────────────────────────────────────────────────────
  # Loki — logs backend
  # ─────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.2
    container_name: nexus-loki
    restart: unless-stopped
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - '3100:3100'
    networks:
      - nexus

  # ─────────────────────────────────────────────────────────────
  # Tempo — traces backend
  # ─────────────────────────────────────────────────────────────
  tempo:
    image: grafana/tempo:2.7.1
    container_name: nexus-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - '3200:3200' # tempo
      - '4317' # otlp grpc
    networks:
      - nexus

  # ─────────────────────────────────────────────────────────────
  # Grafana — visualization
  # ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.5.2
    container_name: nexus-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - nexus

# networks:
#   nexus:
#     external: true

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
